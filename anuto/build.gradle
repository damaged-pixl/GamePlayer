apply plugin: 'com.android.library'

android {
    namespace 'ch.logixisland.anuto'
    compileSdk 36

    defaultConfig {
        minSdkVersion 23
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable 'MissingTranslation'
    }
}
